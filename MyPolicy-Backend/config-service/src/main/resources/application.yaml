# ============================================
# Configuration Service - Server Settings
# ============================================
server:
  port: 8888

spring:
  application:
    name: config-service

  # ============================================
  # Config Server - Native File System Backend
  # ============================================
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          # Using both for reliability in ECS
          search-locations:
            - classpath:/config-repo
            - file:/app/config-repo
        default-label: master

  # ============================================
  # Security Configuration
  # ============================================
  security:
    user:
      name: admin
      password: config123

# ============================================
# Actuator & Eureka Settings
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      # CHANGE: Pointing to the Load Balancer URL instead of discovery-service
      defaultZone: http://mypolicy-alb-1359684399.us-east-1.elb.amazonaws.com/eureka/
  instance:
    prefer-ip-address: true

# ============================================
# Logging
# ============================================
logging:
  level:
    org.springframework.cloud.config: DEBUG
    com.mypolicy.config: INFO