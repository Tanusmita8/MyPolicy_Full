# ============================================
# BFF Service Configuration (from Config Server)
# ============================================

server.port=8090
spring.application.name=bff-service

# ============================================
# Feign Configuration
# ============================================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=BASIC
feign.client.config.customer-service.url=http://customer-service:8081
feign.client.config.data-pipeline-service.url=http://data-pipeline-service:8082
feign.client.config.policy-service.url=http://policy-service:8085

# ============================================
# Logging
# ============================================
logging.level.com.mypolicy.bff=DEBUG
logging.level.feign=DEBUG

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# Eureka Discovery
# ============================================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-service:8761/eureka}
eureka.instance.prefer-ip-address=true