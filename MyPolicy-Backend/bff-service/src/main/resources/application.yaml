server:
  port: 8090

spring:
  application:
    name: bff-service
  config:
    import: optional:configserver:http://admin:config123@mypolicy-alb-1359684399.us-east-1.elb.amazonaws.com

  # --- ADDED CORS FOR S3 ACCESS ---
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${ALLOWED_ORIGINS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
      customer-service:
        url: http://mypolicy-alb-1359684399.us-east-1.elb.amazonaws.com
      data-pipeline-service:
        url: http://mypolicy-alb-1359684399.us-east-1.elb.amazonaws.com
      policy-service:
        url: http://mypolicy-alb-1359684399.us-east-1.elb.amazonaws.com

eureka:
  client:
    service-url:
      defaultZone: http://mypolicy-alb-1359684399.us-east-1.elb.amazonaws.com/eureka/
  instance:
    prefer-ip-address: true