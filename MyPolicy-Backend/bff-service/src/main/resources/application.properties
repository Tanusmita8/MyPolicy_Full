server.port=8090
spring.application.name=bff-service
spring.config.import=optional:configserver:http://admin:config123@config-service:8888

# Service URLs
customer.service.url=http://customer-service:8081
policy.service.url=http://policy-service:8085

# Data Pipeline Service
data-pipeline.service.url=http://data-pipeline-service:8082
ingestion.service.url=http://data-pipeline-service:8082
metadata.service.url=http://data-pipeline-service:8082
processing.service.url=http://data-pipeline-service:8082

# Feign Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# Logging
logging.level.com.mypolicy.bff=DEBUG

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-service:8761/eureka}
eureka.instance.prefer-ip-address=true